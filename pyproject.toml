[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprute"
version = "0.3.0"
description = "Generate animated, 8-directional character sprites."
requires-python = ">=3.12"
dependencies = [
    "typer", 
    "rich", 
    "pillow",
    "huggingface-hub",
    "nvidia-ml-py",
]

[project.scripts]
sprute = "sprute.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
