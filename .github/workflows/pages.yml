name: Pages

# Publishes the browser examples to https://sprited-ai.github.io/sprute/examples/.
# The site root (site/index.html) redirects to the GitHub repository.
on:
  push:
    branches: [main]
    paths: [site/**, examples/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/examples
          cp -R site/. _site/
          cp -R examples/brawler examples/sprites _site/examples/
          # Generators and docs stay in the repo; the site only needs what the browser loads.
          rm -f _site/examples/brawler/pack.py _site/examples/brawler/make_character.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
