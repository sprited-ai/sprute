# npm Trusted Publishing (OIDC) — no token, npm trusts this repo+workflow.
# Publishes on GitHub release, or manually via workflow_dispatch.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: python3 runtime/test-install-models.py
      - run: pnpm build
      - run: npm publish
