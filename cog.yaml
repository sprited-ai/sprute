build:
  gpu: true
  cuda: "13.0"
  python_version: "3.12"
  system_packages: [git, ffmpeg, libgl1, libglib2.0-0]
  python_requirements: deploy/replicate/requirements.txt
  run:
    # Build commands run before project sources are copied into the image.
    # Keep these revisions aligned with src/sprute/setup.py.
    - |
      python - <<'PYTHON'
      from importlib.metadata import distribution
      from pathlib import Path
      import subprocess
      import sys
      
      root = Path(distribution("comfyui").locate_file("comfy/custom_nodes"))
      constraints = Path("/tmp/sprute-constraints.txt")
      constraints.write_text("torch==2.14.0\ntorchvision==0.29.0\ncomfyui==0.37.0.1\n")
      nodes = [
          ('ComfyUI-KJNodes', 'https://github.com/kijai/ComfyUI-KJNodes.git', 'd3cfe21625e5170126ce06fbfcfe1d88108688c3'),
          ('ComfyUI-RMBG', 'https://github.com/kndlt/ComfyUI-RMBG.git', '7f02fab3f33aee806002c9b349cc9ea763f4d2e7'),
          ('comfyui-fitsize', 'https://github.com/bronkula/comfyui-fitsize.git', 'dff0221df4859a6de4a7ef26d5a3900a153818e1'),
          ('ComfyUI-Custom-Scripts', 'https://github.com/pythongosssss/ComfyUI-Custom-Scripts.git', '609f3afaa74b2f88ef9ce8d939626065e3247469'),
          ('ComfyUI-VideoHelperSuite', 'https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git', '4d907bee61e92c2e65af3bd6383a4e4d356126d1'),
       ]
      for name, repository, revision in nodes:
          destination = root / name
          subprocess.run(["git", "init", str(destination)], check=True)
          subprocess.run(["git", "-C", str(destination), "fetch", "--depth", "1", repository, revision], check=True)
          subprocess.run(["git", "-C", str(destination), "checkout", "--detach", "FETCH_HEAD"], check=True)
          requirements = destination / "requirements.txt"
          if requirements.exists():
              subprocess.run([sys.executable, "-m", "pip", "install", "--no-cache-dir", "-c", str(constraints), "-r", str(requirements)], check=True)
      PYTHON
predict: "predict.py:Predictor"
