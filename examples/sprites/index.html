<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprute sprite viewer</title>
  <meta name="description" content="Sprute generates animated, eight-direction character sprites from a text prompt or an image, on your own GPU.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss: #22301f;
      --moss-2: #2e4129;
      --moss-3: #3b5434;
      --bone: #efebdd;
      --lichen: #a9b79a;
      --key: #e64aa0;
      --check-a: #d4d4d0;
      --check-b: #f1f0ea;
      --sans: "Bricolage Grotesque", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--moss); }
    body {
      margin: 0;
      background: var(--moss);
      color: var(--bone);
      font: 400 1.125rem/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--bone); text-decoration-color: var(--key); text-underline-offset: 0.2em; }
    a:hover { color: var(--key); }
    :focus-visible { outline: 3px solid var(--key); outline-offset: 3px; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    header.top { display: flex; justify-content: space-between; align-items: baseline; padding: 28px 0; }
    .wordmark { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; text-decoration: none; }
    .top nav { display: flex; gap: 24px; font-size: 1rem; }

    .hero { padding-bottom: 96px; }
    .hero h1 {
      font-weight: 800;
      font-size: clamp(2.75rem, 7.5vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.035em;
      margin: 48px 0 24px;
      max-width: 11ch;
    }
    .hero .lede { max-width: 34em; color: var(--lichen); font-size: 1.25rem; margin: 0 0 40px; }

    /* The sprite sheet stage: a transparency grid, like any sprite editor. */
    .sheet {
      background-color: var(--check-b);
      background-image:
        linear-gradient(45deg, var(--check-a) 25%, transparent 25%, transparent 75%, var(--check-a) 75%),
        linear-gradient(45deg, var(--check-a) 25%, transparent 25%, transparent 75%, var(--check-a) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      border-radius: 6px;
      color: var(--moss);
      overflow: hidden;
    }
    .cells { display: grid; grid-template-columns: repeat(8, 1fr); }
    .cell { position: relative; border-right: 1px dashed rgba(34, 48, 31, 0.25); }
    .cell:last-child { border-right: 0; }
    .cell canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    .cell span {
      position: absolute; left: 8px; top: 6px;
      font: 600 0.8125rem/1 var(--mono);
      color: var(--moss);
      background: var(--check-b);
      padding: 3px 5px;
      border-radius: 3px;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center;
      margin-top: 16px; font-size: 1rem; color: var(--lichen);
    }
    .seg { display: inline-flex; gap: 4px; align-items: center; }
    .seg button {
      font: 600 1rem/1 var(--sans);
      color: var(--bone);
      background: transparent;
      border: 1px solid var(--moss-3);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: #fff; }
    .seg .label { margin-right: 8px; }





    @media (max-width: 720px) {
      .cells { grid-template-columns: repeat(4, 1fr); }
      .cell:nth-child(4) { border-right: 0; }
      .cell:nth-child(-n+4) { border-bottom: 1px dashed rgba(34, 48, 31, 0.25); }
      .wrap { padding: 0 16px; }
      .seg { flex-wrap: wrap; }
      .seg .label { flex-basis: 100%; margin: 0 0 4px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="wordmark" href="https://github.com/sprited-ai/sprute">sprute</a>
      <nav>
        <a href="../brawler/">Play the brawler</a>
        <a href="https://github.com/sprited-ai/sprute/tree/main/examples/sprites">Source</a>
      </nav>
    </header>

    <main class="hero">
      <h1>Sprite viewer</h1>
      <p class="lede">Characters generated by sprute, in all eight directions. Pick a character and a motion.</p>

      <div class="sheet" aria-label="The selected character in all eight directions">
        <div class="cells" id="cells"></div>
      </div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Character">
          <span class="label">Character</span>
          <span id="who"></span>
        </div>
        <div class="seg" role="group" aria-label="Motion">
          <span class="label">Motion</span>
          <span id="what"></span>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    // The stage reads packed atlases (examples/brawler/pack.py): one image per
    // motion, a row per direction (S, SE, E, NE, N, NW, W, SW), a column per frame.
    // characters/ holds characters shown only here; the brawler's cast follows.
    const DIRECTIONS = ["S", "SE", "E", "NE", "N", "NW", "W", "SW"];
    const ORDER = ["idle", "walk", "run", "jump", "punch", "kick", "act", "win"];
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const load = async (base) => {
      const ids = await (await fetch(base + "characters.json")).json();
      return Promise.all(ids.map(async (id) => ({ id, base, ...(await (await fetch(`${base}${id}/manifest.json`)).json()) })));
    };
    const showcase = await load("characters/");
    const cast = await load("../brawler/characters/");
    const stage = [...showcase, ...cast];
    const byId = Object.fromEntries(stage.map((c) => [c.id, c]));
    const images = {};
    const sheet = (character, motion) => {
      const key = `${character.id}/${motion}`;
      if (!images[key]) {
        const image = new Image();
        // Draw as soon as it arrives, so a paused tab still shows a frame.
        image.onload = () => draw(performance.now());
        image.src = `${character.base}${character.id}/${character.motions[motion].file}`;
        images[key] = image;
      }
      return images[key];
    };

    const SIZE = 160;
    const cells = document.getElementById("cells");
    const canvases = DIRECTIONS.map((name) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = SIZE * devicePixelRatio;
      const label = document.createElement("span");
      label.textContent = name;
      cell.append(canvas, label);
      cells.append(cell);
      return canvas;
    });

    let who = stage[0].id, what = "run";
    function buttons(host, options, current, pick) {
      host.replaceChildren(...options.map((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option;
        button.setAttribute("aria-pressed", option === current);
        button.onclick = () => {
          pick(option);
          draw(performance.now());
          for (const b of host.children) b.setAttribute("aria-pressed", b === button);
        };
        return button;
      }));
    }
    function motionButtons() {
      const motions = ORDER.filter((m) => m in byId[who].motions);
      if (!motions.includes(what)) what = motions.includes("run") ? "run" : motions[0];
      buttons(document.getElementById("what"), motions, what, (v) => { what = v; });
    }
    buttons(document.getElementById("who"), stage.map((c) => c.id), who, (v) => { who = v; motionButtons(); });
    motionButtons();

    function drawCell(ctx, image, manifest, row, frame, size) {
      const [w, h] = manifest.cell;
      const scale = size / h;
      ctx.drawImage(image, frame * w, row * h, w, h, (size - w * scale) / 2, 0, w * scale, h * scale);
    }

    function draw(now) {
      const manifest = byId[who];
      const info = manifest.motions[what];
      const image = sheet(manifest, what);
      const frame = still ? 0 : Math.floor(now / 1000 * manifest.fps) % info.frames;
      if (image.complete && image.naturalWidth) {
        canvases.forEach((canvas, row) => {
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawCell(ctx, image, manifest, row, frame, canvas.width);
        });
      }
    }
    function tick(now) {
      draw(now);
      requestAnimationFrame(tick);
    }

    draw(performance.now());
    requestAnimationFrame(tick);

  </script>
</body>
</html>
